name: Feature request
description: 提议新的迁移能力、兼容范围或开发体验改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先确认需求不依赖真实用户数据、内部环境或私有凭证。
        大型 recipe/target profile 变化应先讨论设计和兼容边界。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与安全边界
      description: 说明 OpenCode 版本、session 形态、fail-closed 和回滚影响。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容不包含真实用户数据、数据库、凭证、内部地址或生产标识。
          required: true
